[package]
name = "miditui"
version = "0.1.0"
edition = "2021"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
description = "A terminal MIDI player with multi-track piano roll visualizer and SoundFont synthesis"
license = "Apache-2.0"
repository = "https://github.com/pinkpixel-dev/miditui"

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
midly = "0.5.3"
rustysynth = "1.3.6"
cpal = "0.18.2"
clap = { version = "4.5.31", features = ["derive"] }
anyhow = "1.0.97"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
